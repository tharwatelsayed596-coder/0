    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاورما الخان</title>
    <!-- استدعاء خطوط جوجل -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- خط Tajawal للعناوين العريضة، وخط Cairo للنصوص -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">
    <!-- ربط ملف التنسيقات -->
    <link rel="stylesheet" href="style.css">

<body>

      <!-- الغلاف والهوية البصرية -->
    <header class="cover-header">
        <!-- صورة الغلاف -->
        <img src="DD.jpg" alt="غلاف شاورما الرخان" class="cover-image">
        
        <!-- طبقة شفافة فوق الغلاف عشان الكلام يبان -->
        <div class="cover-overlay"></div>

        <!-- محتوى الهيدر (اللوجو والكلام) -->
        <div class="header-content">
            <!-- اللوجو -->

            
            <!-- النصوص -->
            <div class="header-text">

                <p class="address">📍 ميدان المحطة - سور محطة السكة الحديد</p>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- أزرار التنقل بين الأقسام (Tabs) -->
        <nav class="categories-nav" id="categories-nav">
            <!-- سيتم توليد الأزرار هنا عبر الجافاسكريبت -->
        </nav>

        <!-- حاوية عرض الأصناف -->
        <section class="menu-display-area" id="menu-display-area">
            <!-- سيتم عرض أصناف القسم المختار هنا -->
        </section>
    </main>

    <!-- شريط السلة السفلي الثابت -->
    <div class="cart-container">
        <div class="cart-info">
            🛒 <span id="cart-count">0</span> أصناف | الإجمالي: <span class="cart-total-price" id="cart-total">0</span> ج.م
        </div>
        <button class="cart-btn" onclick="openCart()">عرض الفاتوره</button>
    </div>

    <!-- نافذة السلة (Modal) -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>فاتوره الطلبات</h2>
                <button class="close-btn" onclick="closeCart()">&times;</button>
            </div>
            
            <div id="cart-items-list">
                <!-- سيتم إضافة محتويات السلة هنا -->
            </div>
            
            <div class="customer-form" id="customer-data" style="display: none;">
                <h3>بيانات التوصيل</h3>
                <label>الاسم:</label>
                <input type="text" id="custName" placeholder="اكتب اسمك هنا">
                <label>رقم الموبايل:</label>
                <input type="tel" id="custPhone" placeholder="01xxxxxxxxx">
                <label>العنوان بالتفصيل:</label>
                <textarea id="custAddress" rows="2" placeholder="المنطقه،  الشارع، اقرب مكان ليك..."></textarea>
                <label>ملاحظات (اختياري):</label>
                <input type="text" id="custNotes" placeholder="">

                    تأكيد الطلب وإرسال على واتساب

        </div>
    </div>

    <!-- إشعار الإضافة -->
    <div class="toast" id="toast">تمت الإضافة !</div>

    <script src="script.js"></script>
